services:
  oracle-db:
    image: gvenzl/oracle-free:23-slim
    container_name: oracle-english-app
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PASSWORD=SuperPassword123
      - APP_USER=english_admin
      - APP_USER_PASSWORD=AdminPassword123
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  oracle_data: